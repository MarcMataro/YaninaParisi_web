<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <title>Test Availability API</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        pre { background: #f5f5f5; padding: 10px; border-radius: 4px; }
        .slot { padding: 10px; margin: 5px; border: 1px solid #ccc; display: inline-block; }
        .slot.occupied { background: #ffcccc; }
        .slot.available { background: #ccffcc; }
    </style>
</head>
<body>
    <h1>Test API de Disponibilitat</h1>
    
    <div>
        <label>Data: <input type="date" id="testDate" value="2025-11-05"></label>
        <button onclick="testAPI()">Comprovar</button>
    </div>
    
    <h2>Resposta API:</h2>
    <pre id="apiResponse"></pre>
    
    <h2>Slots:</h2>
    <div id="slots"></div>

    <script>
        function testAPI() {
            const date = document.getElementById('testDate').value;
            const url = '/yaninaparisi/api/get_availability.php?date=' + date + '&debug=1';
            
            document.getElementById('apiResponse').textContent = 'Carregant...';
            document.getElementById('slots').innerHTML = '';
            
            fetch(url)
                .then(res => res.json())
                .then(json => {
                    document.getElementById('apiResponse').textContent = JSON.stringify(json, null, 2);
                    
                    if (json.success && json.slots) {
                        const slotsDiv = document.getElementById('slots');
                        json.slots.forEach(slot => {
                            const div = document.createElement('div');
                            div.className = 'slot ' + (slot.available ? 'available' : 'occupied');
                            div.textContent = slot.time + (slot.available ? ' ✓ Disponible' : ' ✗ Ocupat');
                            slotsDiv.appendChild(div);
                        });
                    }
                })
                .catch(err => {
                    document.getElementById('apiResponse').textContent = 'Error: ' + err.message;
                    console.error(err);
                });
        }
        
        // Auto-test on load
        window.addEventListener('load', testAPI);
    </script>
</body>
</html>
